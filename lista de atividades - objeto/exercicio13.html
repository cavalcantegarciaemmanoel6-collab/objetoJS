<html lang="pt-br" dir="ltr">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title>Exercício 13 - Arrays</title>
        <script>

            var fazenda = {
                animais: [],

                cadastrarAnimal: function() {
                    nome = prompt("Informe o nome do animal: ")
                    especie = prompt("Informe a espécie: ")
                    idade = Number(prompt("Informe a idade: "))
                    quantidadeProduzida = Number(prompt("Informe a quantidade produzida: "))

                    this.animais.push({
                        nome: nome,
                        especie: especie,
                        idade: idade,
                        quantidadeProduzida: quantidadeProduzida
                    })
                },

                removerAnimal: function() {
                    nome = prompt("Informe o nome do animal que deseja remover: ")

                    indice = this.animais.findIndex(function(animal) {
                        return animal.nome == nome
                    })

                    if (indice != -1) {
                        this.animais.splice(indice, 1)
                        console.log("Animal removido com sucesso!")
                    } else {
                        console.log("Animal não encontrado.")
                    }
                },

                buscarAnimal: function() {
                    nome = prompt("Informe o nome do animal que deseja buscar: ")

                    animalEncontrado = this.animais.find(function(animal) {
                        return animal.nome == nome
                    })

                    if (animalEncontrado) {
                        console.log("Nome: " + animalEncontrado.nome)
                        console.log("Espécie: " + animalEncontrado.especie)
                        console.log("Idade: " + animalEncontrado.idade)
                        console.log("Produção: " + animalEncontrado.quantidadeProduzida)
                    } else {
                        console.log("Animal não encontrado.")
                    }
                },

                alimentarTodos: function() {
                    console.log("Todos os animais foram alimentados.")
                },

                calcularProducao: function() {
                    producaoTotal = 0

                    for (i = 0; i < this.animais.length; i++) {
                        producaoTotal = producaoTotal + this.animais[i].quantidadeProduzida
                    }
                },

                infosOrganizadas: function() {
                    console.log("Quantidade de animais: " + this.animais.length)
                    console.log("Produção total: " + producaoTotal)
                }
            }

            fazenda.cadastrarAnimal()
            fazenda.cadastrarAnimal()

            fazenda.alimentarTodos()
            fazenda.buscarAnimal()
            fazenda.calcularProducao()
            fazenda.infosOrganizadas()

        </script>
    </head>
</html>
