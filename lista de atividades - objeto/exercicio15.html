<html lang="pt-br" dir="ltr">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title>Exercício 15 - Arrays</title>
        <script>

            var votacao = {
                candidatos: [],
                eleitores: [],

                cadastrarCandidato: function() {
                    nome = prompt("Informe o nome do candidato: ")

                    this.candidatos.push({
                        nome: nome,
                        votos: 0
                    })
                },

                votar: function() {
                    eleitor = prompt("Informe o nome do eleitor: ")

                    if (this.eleitores.includes(eleitor)) {
                        console.log("Esse eleitor já votou.")
                        return
                    }

                    candidatoEscolhido = prompt("Informe o nome do candidato: ")

                    candidato = this.candidatos.find(function(candidato) {
                        return candidato.nome == candidatoEscolhido
                    })

                    if (candidato) {
                        candidato.votos++
                        this.eleitores.push(eleitor)
                        console.log("Voto registrado com sucesso!")
                    } else {
                        console.log("Candidato não encontrado.")
                    }
                },

                resultadoParcial: function() {
                    console.log("Resultado da votação:")

                    for (i = 0; i < this.candidatos.length; i++) {
                        console.log(
                            this.candidatos[i].nome +
                            ": " +
                            this.candidatos[i].votos +
                            " voto(s)"
                        )
                    }
                },

                informarVencedor: function() {
                    if (this.candidatos.length > 0) {
                        vencedor = this.candidatos[0]

                        for (i = 1; i < this.candidatos.length; i++) {
                            if (this.candidatos[i].votos > vencedor.votos) {
                                vencedor = this.candidatos[i]
                            }
                        }

                        console.log("Candidato com mais votos: " + vencedor.nome)
                        console.log("Quantidade de votos: " + vencedor.votos)
                    }
                }
            }

            votacao.cadastrarCandidato()
            votacao.cadastrarCandidato()
            votacao.cadastrarCandidato()

            votacao.votar()
            votacao.votar()
            votacao.votar()

            votacao.resultadoParcial()
            votacao.informarVencedor()

        </script>
    </head>
</html>
